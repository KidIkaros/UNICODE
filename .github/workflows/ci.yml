name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Build, test, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: clippy, rustfmt
      # Same script a developer runs locally: build, test (both feature
      # sets), clippy -D warnings, fmt, then every layouts/*.json is
      # validated and round-tripped against 4 KiB of fresh random bytes.
      - run: ./scripts/ci-checks.sh

  msrv:
    name: MSRV 1.63 build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: "1.63"
      # The crate claims rust-version = "1.63" and a no_std, zero-
      # dependency core. Building without default features pins both.
      - run: cargo build --lib --no-default-features
